[package]
name = "model-rust"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3.33"
mongodb = { version = "3.8.0", features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
